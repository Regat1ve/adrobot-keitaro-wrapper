<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AdRobot{% endblock %} · Keitaro wrapper</title>
<style>
  :root { --ink:#1f2a37; --muted:#6b7280; --line:#e5e7eb; --blue:#2563eb; --dirty:#fef9c3; --dirty-line:#facc15; --gone:#9ca3af; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:#f8fafc; }
  header { background:#1e3a5f; color:#fff; padding:10px 24px; display:flex; gap:20px; align-items:center; }
  header a { color:#fff; text-decoration:none; }
  header b { font-size:16px; }
  main { max-width:1100px; margin:0 auto; padding:20px 24px 60px; }
  h1 { font-size:20px; margin:0 0 16px; }
  a { color:var(--blue); }
  .muted { color:var(--muted); }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  button, .btn { font:inherit; padding:6px 12px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; cursor:pointer; color:var(--ink); text-decoration:none; display:inline-block; }
  button.primary, .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.small { padding:2px 8px; font-size:12px; }
  input, select { font:inherit; padding:6px 8px; border:1px solid #cbd5e1; border-radius:6px; background:#fff; }
  form.inline { display:inline; margin:0; }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); background:#f1f5f9; }
  .msg { padding:10px 14px; border-radius:6px; margin-bottom:12px; }
  .msg.error { background:#fee2e2; color:#991b1b; }
  .msg.success { background:#dcfce7; color:#166534; }
  .stream { background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:16px; overflow:hidden; }
  .stream.dirty { background:var(--dirty); border-color:var(--dirty-line); }
  .stream.dirty table { background:transparent; }
  .stream-head { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .stream-head h2 { font-size:15px; margin:0; }
  .stream-body { padding:10px 14px; }
  tr.gone td { color:var(--gone); }
  tr.gone td.share { text-decoration:line-through; }
  .share { font-weight:600; white-space:nowrap; }
  .badge { font-size:11px; padding:1px 7px; border-radius:999px; background:#e5e7eb; color:#374151; white-space:nowrap; }
  .badge.new, .badge.restoring { background:#dbeafe; color:#1e40af; }
  .badge.removing { background:#fee2e2; color:#991b1b; }
  .pin { font-size:12px; white-space:nowrap; }
  .pin input { width:56px; padding:2px 4px; }
  .grid { display:grid; grid-template-columns:180px 1fr; gap:12px 16px; align-items:center; max-width:720px; }
  .grid input[type=text], .grid select { width:100%; }
  .hint { font-size:12px; color:var(--muted); grid-column:2; margin-top:-8px; }
</style>
</head>
<body>
<header>
  <b><a href="{% url 'campaigns' %}">AdRobot</a></b>
  <a href="{% url 'campaigns' %}">Кампании</a>
  <a href="{% url 'campaign_new' %}">Новая кампания</a>
</header>
<main>
  {% for message in messages %}<div class="msg {{ message.tags }}">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<datalist id="offers-list"></datalist>
<script>
  // Подсказка офферов: на ввод ходим в /api/offers/, сервер ищет в Keitaro по ID и названию
  let timer;
  document.addEventListener('input', (e) => {
    if (!e.target.matches('input[list="offers-list"]')) return;
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const r = await fetch('{% url "offers_api" %}?q=' + encodeURIComponent(e.target.value.replace(/ —.*/, '')));
      const data = await r.json();
      document.getElementById('offers-list').innerHTML = (data.offers || [])
        .map(o => `<option value="${o.id} — ${o.name.replace(/"/g, '&quot;')}"></option>`).join('');
    }, 200);
  });
</script>
</body>
</html>
